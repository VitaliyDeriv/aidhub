# Least Connections: запит іде на сервер з найменшою кількістю активних з'єднань.
upstream app_backend {
    least_conn;
    server web1:8000 max_fails=2 fail_timeout=10s;
    server web2:8000 max_fails=2 fail_timeout=10s;
    server web3:8000 max_fails=2 fail_timeout=10s;
}

include /etc/nginx/server.inc;
