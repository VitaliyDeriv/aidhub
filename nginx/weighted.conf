# Weighted Round Robin: web1 отримує вдвічі більше запитів, ніж інші.
upstream app_backend {
    server web1:8000 weight=2 max_fails=2 fail_timeout=10s;
    server web2:8000 weight=1 max_fails=2 fail_timeout=10s;
    server web3:8000 weight=1 max_fails=2 fail_timeout=10s;
}

include /etc/nginx/server.inc;
